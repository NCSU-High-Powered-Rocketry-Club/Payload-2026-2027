[project]
name = "PayloadTemplate"
version = "0.1.0"
description = "A template for payloads written in Python. Our AirbrakesV2 repo also follows this template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "firm-client>=1.2.2",
    "polars",
    "msgspec",
    "colorama",
    "numpy",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov",
    "ruff",
    "ty"
]

# UV:
[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# HATCH:
[tool.hatch.build.targets.wheel]
packages = ["payload"]

# RUFF:
[tool.ruff]
line-length = 100
target-version = "py314"
show-fixes = true
exclude = ["scripts"]

[tool.ruff.lint]
ignore = [
    "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PERF203", "ISC001", "S311",
    "D102", "D103", "D104", "D107", "D205", "D401", "D200",
]
select = [
    "E", "F", "I", "PL", "UP", "RUF", "PTH", "C4", "B", "PIE", "SIM", "RET", "RSE",
    "G", "ISC", "PT", "ASYNC", "TCH", "SLOT", "PERF", "PYI", "FLY", "AIR", "Q", "INP",
    "W", "YTT", "DTZ", "ARG", "T20", "FURB", "D100", "D101", "D300", "D418",
    "D419", "S", "NPY", "D", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"main.py" = ["T201"]
"payload/mock/display.py" = ["T201"]
"tests/*.py" = ["T20", "S101", "D100", "ARG001", "RUF012"]

[tool.ty.environment]
root = ["./payload"]

[tool.ty.src]
exclude = ["tests", "scripts"]

[project.scripts]
mock = "payload.main:run_mock_flight"
real = "payload.main:run_real_flight"
pretend = "payload.main:run_pretend_flight"

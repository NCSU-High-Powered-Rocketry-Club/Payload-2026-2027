# Dev tooling only (ruff). ROS 2 packages are built by colcon via their own
# package.xml/setup.py; runtime deps come from rosdep, not uv.
[project]
name = "payload-dev-tools"
version = "0.0.0"
description = "Dev tooling for the Payload ROS 2 workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "install", "log"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"**/test/**" = ["D"]
"**/setup.py" = ["D"]
